[project]
name = "growth-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sheikoh", email = "john-lee.dubos@protonmail.com" }
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "accelerate>=1.14.0",
    "kernels>=0.16.1",
    "load-dotenv>=0.1.0",
    "numpy>=1.26",
    "pydantic>=2.7",
    "qdrant-client>=1.12",
    "requests>=2.32",
    "torch>=2.14.0",
    "transformers>=5.16.1",
]

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
torchaudio = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[project.scripts]
growth-rag = "growth_rag:main"
gutenberg = "growth_rag.sources.gutenberg.cli:main"
rag = "growth_rag.cli:main"

[project.optional-dependencies]
# Reference bge-m3 implementation, for `rag embed --backend flag` and `rag embed-check`.
flag = ["FlagEmbedding>=1.3"]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
